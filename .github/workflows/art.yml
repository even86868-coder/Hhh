name: Paint game art
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to do'
        type: choice
        options:
          - preview (count and cost, paint nothing)
          - paint a sample (one of each kind)
          - paint everything missing
        default: preview (count and cost, paint nothing)
      redo:
        description: 'Repaint these images (comma-separated keys, e.g. npc:ameiko,scene:inn)'
        type: string
        default: ''
permissions:
  contents: write
concurrency:
  group: art-${{ github.ref }}
  cancel-in-progress: false
jobs:
  paint:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the API key secret
        if: "!startsWith(inputs.mode, 'preview')"
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then echo "::error::Add a repository secret named OPENAI_API_KEY (Settings > Secrets and variables > Actions)."; exit 1; fi
      - name: Preview
        run: node tools/generate-art.mjs --dry-run
      - name: Paint
        if: "!startsWith(inputs.mode, 'preview')"
        run: node tools/generate-art.mjs ${{ startsWith(inputs.mode, 'paint a sample') && '--sample --limit 5' || '' }} ${{ inputs.redo && format('--redo {0}', inputs.redo) || '' }}
      - name: Commit art
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add art
          if git diff --cached --quiet; then echo "Nothing new to commit."; exit 0; fi
          git commit -m "Update painted art (${{ inputs.mode }})"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
